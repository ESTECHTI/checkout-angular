name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Testes e build do Angular
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Executar os testes
        run: npm run test:ci

      - name: Gerar o build de produção
        run: npm run build:ci -- --base-href=/checkout-angular/

      - name: Preparar acesso direto às telas
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: dist/checkout-angular/browser
        run: |
          for rota in pagamento sucesso erro; do
            mkdir -p "$rota"
            cp index.html "$rota/index.html"
          done

      - name: Empacotar site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/checkout-angular/browser

  deploy:
    name: Publicar demonstração
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
